<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container align-items-center">

        {% if user.is_authenticated %}

        <!-- Логотип и название -->
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="/static/image/app_logo/rec_sys_without.png" alt="rec_sys" width="70" height="63"
                 class="me-2">
            <strong>Система рекомендаций</strong>
        </a>

        <!-- Кнопки навигации -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-5">
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'user_recommendations_page' %}active fw-bold{% endif %}"
                   href="{% url 'recommender:user_recommendations_page' %}">
                    Рекомендации для меня
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'user_preferences_page' %}active fw-bold{% endif %}"
                   aria-current="page"
                   href="{% url 'preferences:user_preferences_page' %}">
                    Мои предпочтения
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.resolver_match.url_name == 'recommendation_statistics_page' %}active fw-bold{% endif %}"
                   href="{% url 'recommender:recommendation_statistics_page' %}">
                    Статистика
                </a>
            </li>
        </ul>

        <!-- Аутентификация -->
        <div class="dropdown">
            <a class="avatar-link dropdown-toggle" href="#" role="button" id="dropdownMenuButton"
               data-bs-toggle="dropdown" aria-expanded="false">
                <img src="{% if user.avatar and user.avatar.name %}{{ user.avatar.url }}{% else %}/static/image/default_avatar_user/default_ava.png{% endif %}"
                     alt="Аватар"
                     class="rounded-circle" style="width: 45px; height: 45px;">
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
                <li><span class="dropdown-item-text">{{ user.email }}</span></li>
                <li><a class="dropdown-item" href="#">Редактировать профиль</a></li>
                <li><a class="dropdown-item" href="#">Изменить пароль</a></li>
                <li>
                    <form method="post" action="{% url 'users:logout_page' %}">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item">Выйти</button>
                    </form>
                </li>
            </ul>
        </div>

        {% else %}

        <!-- Логотип и название для неавторизованного пользователя -->
        <!-- Альтернативный трюк: я сделал визуально одинаковую высоту, но так как логотип не нужен в else, то просто использую прозрачный логотип-->
        <img src="/static/image/app_logo/rec_sys.png" style="opacity: 0;" width="70" height="63" class="me-2">

        {% endif %}

    </div>
</nav>
